<!DOCTYPE html>
<html lang="tl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Continuous 20 Round Letter Analyzer</title>


<style>

/* ============================================================
   GLOBAL
============================================================ */

* {
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    margin: 0;

    padding: 20px;

    background: #f4f4f9;
}


.container {

    max-width: 700px;

    margin: auto;

    background: white;

    padding: 20px;

    border-radius: 10px;

    box-shadow:
        0 0 12px rgba(0,0,0,0.12);
}


.section {

    margin-bottom: 20px;
}


label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;
}


input[type="number"] {

    width: 100%;

    padding: 10px;

    border: 1px solid #ccc;

    border-radius: 5px;

    font-size: 16px;

    margin-bottom: 10px;
}


/* ============================================================
   GRID
============================================================ */

.grid-container {

    display: grid;

    grid-template-columns:
        repeat(12, 30px);

    grid-template-rows:
        repeat(6, 30px);

    gap: 4px;

    overflow-x: auto;

    margin-top: 10px;

    padding-bottom: 5px;
}


.grid-box {

    width: 30px;

    height: 30px;

    border: 1px solid #ccc;

    border-radius: 4px;

    text-align: center;

    font-size: 16px;

    font-weight: bold;

    text-transform: uppercase;

    padding: 0;

    outline: none;

    background: white;
}


.grid-box:focus {

    border-color: #3498db;
}


.box-green {

    background-color:
        #27ae60 !important;

    color: white !important;
}


/* ============================================================
   BUTTONS
============================================================ */

.btn-group {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


button {

    padding: 10px 15px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    color: white;

    font-size: 15px;
}


.btn-loss {

    background: #f0ad4e;
}


.btn-reset-bet {

    background: #3498db;
}


.btn-reset-all {

    background: #d9534f;
}


button:hover {

    opacity: 0.85;
}


/* ============================================================
   RESULT
============================================================ */

.result {

    font-size: 18px;

    font-weight: bold;
}


/* ============================================================
   COMBINATION BOX
============================================================ */

.prediction-box {

    background: #222;

    color: white;

    padding: 18px;

    border-radius: 8px;

    text-align: center;
}


.prediction-title {

    font-size: 14px;

    color: #aaa;

    margin-bottom: 8px;
}


.prediction-result {

    font-size: 25px;

    font-weight: bold;

    color: #f1c40f;

    min-height: 30px;

    word-break: break-word;

    line-height: 1.6;
}


.prediction-info {

    margin-top: 10px;

    font-size: 13px;

    color: #aaa;

    line-height: 1.5;
}


.round-counter {

    margin-top: 10px;

    font-size: 15px;

    font-weight: bold;
}


.status {

    margin-top: 8px;

    font-size: 13px;

    color: #666;
}


/* ============================================================
   COUNT BOX
   HIDDEN
============================================================ */

.count-box {

    display: none !important;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 500px) {

    body {

        padding: 10px;
    }


    .container {

        padding: 15px;
    }


    .grid-container {

        grid-template-columns:
            repeat(12, 30px);
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         AUTO COMPUTE / TAYA
    ====================================================== -->

    <div class="section">

        <label for="baseAmount">
            Base Amount:
        </label>


        <input
            type="number"
            id="baseAmount"
            placeholder="Halimbawa: 50"
            oninput="autoCompute()"
        >


        <div class="result">

            Resulta / Taya:

            <span id="computedResult">
                0
            </span>

        </div>


        <small style="color:#666;">

            Formula:
            (Total × 2) + Base

        </small>


        <div
            class="btn-group"
            style="margin-top:10px;"
        >

            <button
                class="btn-loss"
                onclick="applyLoss()"
            >
                LOSS
            </button>


            <button
                class="btn-reset-bet"
                onclick="resetBet()"
            >
                Reset Taya
            </button>

        </div>

    </div>


    <hr>


    <!-- =====================================================
         CONTINUOUS RESULT
    ====================================================== -->

    <div class="section">

        <label>
            Continuous Letter Result
        </label>


        <div class="prediction-box">


            <div class="prediction-title">

                COMBINATION

            </div>


            <div
                id="mainPredictionText"
                class="prediction-result"
            >
                -
            </div>


            <div
                id="mainPredictionLayer"
                class="prediction-info"
            >

                Kailangan muna ng
                20 completed rounds.

            </div>


        </div>


        <div class="round-counter">

            Completed Rounds:

            <span id="roundCount">
                0 / 20
            </span>

        </div>


        <div
            id="statusText"
            class="status"
        >

            Waiting for 20 rounds...

        </div>


        <!-- HIDDEN COUNT BOX -->

        <div
            id="countBox"
            class="count-box"
        >
        </div>

    </div>


    <hr>


    <!-- =====================================================
         GRID
    ====================================================== -->

    <div class="section">

        <label>

            Grid Boxes
            (6 pababa × 12 pahaba)

        </label>


        <div
            id="gridContainer"
            class="grid-container"
        >
        </div>


        <small style="color:#666;">

            Allowed letters:
            W, B, R, G, Y, P

        </small>

    </div>


    <!-- =====================================================
         RESET ALL
    ====================================================== -->

    <div class="section">

        <button
            class="btn-reset-all"
            onclick="resetAll()"
        >

            Reset Lahat

        </button>

    </div>


</div>



<script>

/* ============================================================
   SETTINGS
============================================================ */

const ROWS = 6;

const COLS = 12;


const TRACKED_LETTERS = [

    "W",
    "B",
    "R",
    "G",
    "Y",
    "P"

];


const MIN_ROUNDS = 20;


const STORAGE_KEY =
    "continuousLetterGridData";


/* ============================================================
   GRID
============================================================ */

const gridContainer =
    document.getElementById(
        "gridContainer"
    );


const gridMatrix = [];


for (
    let r = 0;
    r < ROWS;
    r++
) {

    gridMatrix[r] = [];


    for (
        let c = 0;
        c < COLS;
        c++
    ) {


        const input =
            document.createElement(
                "input"
            );


        input.type = "text";


        input.maxLength = 1;


        input.className =
            "grid-box";


        input.dataset.row = r;

        input.dataset.col = c;


        /* ====================================================
           INPUT EVENT
        ==================================================== */

        input.addEventListener(
            "input",
            function () {


                let value =
                    this.value
                        .trim()
                        .toUpperCase();


                /* --------------------------------------------
                   ALLOWED LETTERS ONLY
                -------------------------------------------- */

                if (

                    value !== "" &&

                    !TRACKED_LETTERS
                        .includes(value)

                ) {

                    this.value = "";

                }
                else {

                    this.value =
                        value;

                }


                /* --------------------------------------------
                   AUTOMATIC PROCESS
                -------------------------------------------- */

                processGrid();


                saveToLocalStorage();

            }
        );


        gridContainer.appendChild(
            input
        );


        gridMatrix[r][c] =
            input;

    }

}


/* ============================================================
   AUTO COMPUTE
============================================================ */

function autoCompute() {


    const base =
        parseFloat(
            document.getElementById(
                "baseAmount"
            ).value
        );


    if (isNaN(base)) {

        document.getElementById(
            "computedResult"
        ).innerText = "0";

        return;
    }


    const result =
        (base * 2) + base;


    document.getElementById(
        "computedResult"
    ).innerText =
        result;

}


/* ============================================================
   LOSS
============================================================ */

function applyLoss() {


    const base =
        parseFloat(
            document.getElementById(
                "baseAmount"
            ).value
        );


    if (
        isNaN(base) ||
        base <= 0
    ) {

        alert(
            "Maglagay muna ng Base Amount."
        );

        return;
    }


    let current =
        parseFloat(
            document.getElementById(
                "computedResult"
            ).innerText
        );


    if (
        isNaN(current) ||
        current === 0
    ) {

        current = base;

    }


    const next =
        (current * 2) + base;


    document.getElementById(
        "computedResult"
    ).innerText =
        next;

}


/* ============================================================
   RESET BET
============================================================ */

function resetBet() {


    document.getElementById(
        "baseAmount"
    ).value = "";


    document.getElementById(
        "computedResult"
    ).innerText =
        "0";

}


/* ============================================================
   PROCESS GRID
============================================================ */

function processGrid() {


    /* ========================================================
       REMOVE OLD GREEN MARKS
    ======================================================== */

    for (
        let r = 0;
        r < ROWS;
        r++
    ) {

        for (
            let c = 0;
            c < COLS;
            c++
        ) {

            gridMatrix[r][c]
                .classList
                .remove(
                    "box-green"
                );

        }

    }


    /* ========================================================
       STREAK LOGIC
    ======================================================== */

    for (
        let r = 0;
        r < ROWS;
        r++
    ) {


        let c = 0;


        while (
            c < COLS
        ) {


            const value =
                gridMatrix[r][c]
                    .value
                    .trim()
                    .toUpperCase();


            if (
                value === ""
            ) {

                c++;

                continue;

            }


            const startC =
                c;


            let streak = 0;


            let nextC =
                c;


            while (

                nextC < COLS &&

                gridMatrix[r][nextC]
                    .value
                    .trim()
                    .toUpperCase()
                    === value

            ) {

                streak++;

                nextC++;

            }


            /* =================================================
               4 OR MORE CONSECUTIVE
            ================================================= */

            if (
                streak >= 4
            ) {


                for (
                    let i =
                        startC + 4;

                    i < COLS;

                    i++
                ) {


                    const current =
                        gridMatrix[r][i]
                            .value
                            .trim()
                            .toUpperCase();


                    if (

                        current === value ||

                        current === ""

                    ) {


                        gridMatrix[r][i]
                            .classList
                            .add(
                                "box-green"
                            );


                        if (
                            current === ""
                        ) {

                            break;

                        }

                    }
                    else {

                        break;

                    }

                }

            }


            c =
                nextC;

        }

    }


    /* ========================================================
       UPDATE CONTINUOUS RESULT
    ======================================================== */

    updateMainPrediction();

}


/* ============================================================
   GENERATE COMBINATIONS
============================================================

   Example:

   W R B G

   Output:

   W/R
   W/B
   W/G
   R/B
   R/G
   B/G

============================================================ */

function generateCombinations(
    letters
) {


    const combinations = [];


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {


        for (
            let j = i + 1;
            j < letters.length;
            j++
        ) {


            combinations.push(

                `${letters[i]}/${letters[j]}`

            );

        }

    }


    return combinations;

}


/* ============================================================
   CONTINUOUS PREDICTION
============================================================ */

function updateMainPrediction() {


    const resultElement =
        document.getElementById(
            "mainPredictionText"
        );


    const infoElement =
        document.getElementById(
            "mainPredictionLayer"
        );


    const roundElement =
        document.getElementById(
            "roundCount"
        );


    const statusElement =
        document.getElementById(
            "statusText"
        );


    /* ========================================================
       1. COLLECT ALL VALID LETTERS
    ======================================================== */

    let allRounds = [];


    for (
        let r = 0;
        r < ROWS;
        r++
    ) {


        for (
            let c = 0;
            c < COLS;
            c++
        ) {


            const value =
                gridMatrix[r][c]
                    .value
                    .trim()
                    .toUpperCase();


            if (

                TRACKED_LETTERS
                    .includes(value)

            ) {

                allRounds.push(
                    value
                );

            }

        }

    }


    /* ========================================================
       TOTAL ROUND DISPLAY
    ======================================================== */

    roundElement.innerText =
        `${allRounds.length} / ${MIN_ROUNDS}`;


    /* ========================================================
       LESS THAN 20
    ======================================================== */

    if (
        allRounds.length <
        MIN_ROUNDS
    ) {


        resultElement.innerText =
            "-";


        infoElement.innerText =
            `Kulang pa ang rounds ` +
            `(${allRounds.length}/${MIN_ROUNDS}). ` +
            `Kailangan muna ng 20 completed rounds.`;


        statusElement.innerText =
            "Waiting for 20 rounds...";


        return;

    }


    /* ========================================================
       CONTINUOUS ROLLING LATEST 20
       
       20 rounds:
       1–20

       21 rounds:
       2–21

       22 rounds:
       3–22

       23 rounds:
       4–23

       24 rounds:
       5–24

       CONTINUOUS FOREVER
    ======================================================== */

    const latest20 =
        allRounds.slice(
            -MIN_ROUNDS
        );


    /* ========================================================
       COUNT LATEST 20
    ======================================================== */

    const counts = {};


    TRACKED_LETTERS.forEach(
        letter => {

            counts[letter] = 0;

        }
    );


    latest20.forEach(
        letter => {

            counts[letter]++;

        }
    );


    /* ========================================================
       SORT HIGH → LOW
    ======================================================== */

    const highToLow =
        TRACKED_LETTERS
            .slice()
            .sort(
                (a, b) => {


                    if (
                        counts[b] !==
                        counts[a]
                    ) {

                        return (
                            counts[b] -
                            counts[a]
                        );

                    }


                    /*
                       SAME COUNT:
                       Keep original order.
                    */

                    return (

                        TRACKED_LETTERS
                            .indexOf(a)

                        -

                        TRACKED_LETTERS
                            .indexOf(b)

                    );

                }
            );


    /* ========================================================
       SORT LOW → HIGH
    ======================================================== */

    const lowToHigh =
        TRACKED_LETTERS
            .slice()
            .sort(
                (a, b) => {


                    if (
                        counts[a] !==
                        counts[b]
                    ) {

                        return (
                            counts[a] -
                            counts[b]
                        );

                    }


                    return (

                        TRACKED_LETTERS
                            .indexOf(a)

                        -

                        TRACKED_LETTERS
                            .indexOf(b)

                    );

                }
            );


    /* ========================================================
       HELPER — ALL TIED LETTERS
    ======================================================== */

    function getTiedLetters(
        count
    ) {


        return TRACKED_LETTERS
            .filter(
                letter =>
                    counts[letter] === count
            );

    }


    /* ========================================================
       RESULT SET
       
       Set prevents duplicates.
    ======================================================== */

    const results =
        new Set();


    /* ========================================================
       1ST RESULT
       
       PINAKAMARAMI
       
       Kapag tie:
       LAHAT NG TIE kasama.
    ======================================================== */

    const highestCount =
        counts[
            highToLow[0]
        ];


    getTiedLetters(
        highestCount
    )
    .forEach(
        letter => {

            results.add(
                letter
            );

        }
    );


    /* ========================================================
       2ND RESULT
       
       PANGALAWA SA MARAMI
       
       DISTINCT COUNT.
       
       Kapag tie:
       LAHAT NG TIE kasama.
    ======================================================== */

    const distinctHighCounts =
        [
            ...new Set(

                highToLow.map(
                    letter =>
                        counts[letter]
                )

            )
        ]
        .sort(
            (a, b) =>
                b - a
        );


    if (
        distinctHighCounts.length >= 2
    ) {


        const secondHighestCount =
            distinctHighCounts[1];


        getTiedLetters(
            secondHighestCount
        )
        .forEach(
            letter => {

                results.add(
                    letter
                );

            }
        );

    }


    /* ========================================================
       3RD RESULT
       
       PANG-LIMANG POSITION
       MULA SA HIGHEST RANKING
       
       Example:

       W 7
       B 5
       R 3
       G 2
       Y 2
       P 1

       5th position = Y

       Pero G at Y ay parehong 2.

       Kaya:
       G + Y
       parehong kasama.
    ======================================================== */

    if (
        highToLow.length >= 5
    ) {


        const fifthLetter =
            highToLow[4];


        const fifthCount =
            counts[
                fifthLetter
            ];


        getTiedLetters(
            fifthCount
        )
        .forEach(
            letter => {

                results.add(
                    letter
                );

            }
        );

    }


    /* ========================================================
       4TH RESULT
       
       PINAKAMABABA
       
       Kapag tie:
       LAHAT NG LOWEST TIE kasama.
    ======================================================== */

    const lowestCount =
        counts[
            lowToHigh[0]
        ];


    getTiedLetters(
        lowestCount
    )
    .forEach(
        letter => {

            results.add(
                letter
            );

        }
    );


    /* ========================================================
       FINAL RESULTS
    ======================================================== */

    const finalResults =
        Array.from(
            results
        );


    /* ========================================================
       COMBINATIONS
    ======================================================== */

    const combinations =
        generateCombinations(
            finalResults
        );


    /* ========================================================
       DISPLAY
    ======================================================== */

    if (
        finalResults.length >= 2
    ) {


        resultElement.innerText =
            combinations.join(
                "  |  "
            );


        infoElement.innerText =
            `Result: ` +
            `${finalResults.join("  ")} ` +
            `— Latest 20 rounds ang ginagamit. ` +
            `Continuous automatic analysis.`;


        statusElement.innerText =
            `ACTIVE — ` +
            `${allRounds.length} total rounds | ` +
            `Latest 20 analyzed | ` +
            `${finalResults.length} unique result(s) | ` +
            `${combinations.length} combination(s)`;


    }
    else {


        resultElement.innerText =
            finalResults.join("  ") ||
            "-";


        infoElement.innerText =
            "Continuous analysis — " +
            "automatic na nagre-recompute " +
            "sa bawat bagong round.";


        statusElement.innerText =
            `ACTIVE — ` +
            `${allRounds.length} total rounds | ` +
            `Latest 20 analyzed`;

    }

}


/* ============================================================
   HIDDEN COUNT DISPLAY
============================================================ */

function updateCountDisplay(
    allRounds
) {


    const countBox =
        document.getElementById(
            "countBox"
        );


    if (!countBox) {

        return;

    }


    /*
       Hidden na ang count display.
    */

    countBox.innerHTML =
        "";

}


/* ============================================================
   SAVE TO LOCAL STORAGE
============================================================ */

function saveToLocalStorage() {


    const data = [];


    for (
        let r = 0;
        r < ROWS;
        r++
    ) {


        const row = [];


        for (
            let c = 0;
            c < COLS;
            c++
        ) {


            row.push(
                gridMatrix[r][c]
                    .value
            );

        }


        data.push(
            row
        );

    }


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* ============================================================
   LOAD FROM LOCAL STORAGE
============================================================ */

function loadFromLocalStorage() {


    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {


        updateMainPrediction();


        return;

    }


    try {


        const data =
            JSON.parse(
                saved
            );


        for (
            let r = 0;
            r < ROWS;
            r++
        ) {


            for (
                let c = 0;
                c < COLS;
                c++
            ) {


                if (

                    data[r] &&

                    data[r][c] !==
                        undefined

                ) {


                    const value =
                        String(
                            data[r][c]
                        )
                        .trim()
                        .toUpperCase();


                    if (

                        value === "" ||

                        TRACKED_LETTERS
                            .includes(value)

                    ) {

                        gridMatrix[r][c]
                            .value =
                            value;

                    }

                }

            }

        }


        processGrid();


    }
    catch (error) {


        console.error(
            "Load error:",
            error
        );


        localStorage.removeItem(
            STORAGE_KEY
        );


        updateMainPrediction();

    }

}


/* ============================================================
   RESET ALL
============================================================ */

function resetAll() {


    if (
        !confirm(
            "Sigurado ka bang i-reset lahat ng rounds at result?"
        )
    ) {

        return;

    }


    /* ========================================================
       RESET BET
    ======================================================== */

    resetBet();


    /* ========================================================
       CLEAR GRID
    ======================================================== */

    for (
        let r = 0;
        r < ROWS;
        r++
    ) {


        for (
            let c = 0;
            c < COLS;
            c++
        ) {


            gridMatrix[r][c]
                .value = "";


            gridMatrix[r][c]
                .classList
                .remove(
                    "box-green"
                );

        }

    }


    /* ========================================================
       CLEAR STORAGE
    ======================================================== */

    localStorage.removeItem(
        STORAGE_KEY
    );


    /* ========================================================
       RESET RESULT
    ======================================================== */

    document.getElementById(
        "mainPredictionText"
    ).innerText =
        "-";


    document.getElementById(
        "mainPredictionLayer"
    ).innerText =
        "Kailangan muna ng 20 completed rounds.";


    document.getElementById(
        "roundCount"
    ).innerText =
        "0 / 20";


    document.getElementById(
        "statusText"
    ).innerText =
        "Waiting for 20 rounds...";


    document.getElementById(
        "countBox"
    ).innerHTML =
        "";

}


/* ============================================================
   START
============================================================ */

window.addEventListener(
    "load",
    loadFromLocalStorage
);

</script>


</body>

</html>
